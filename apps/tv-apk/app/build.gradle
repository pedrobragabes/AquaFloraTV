plugins {
    id "com.android.application"
}

android {
    namespace "com.aquatv.player"
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.aquatv.player"
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName "0.2.0"
        buildConfigField "String", "PLAYER_URL", "\"http://192.168.0.114:7740/player?rotation=90\""
        buildConfigField "String", "API_URL", "\"http://192.168.0.114:7741/api\""
    }

    signingConfigs {
        release {
            storeFile file("../aquatv-local-release.jks")
            storePassword "aquatv-local-release"
            keyAlias "aquatv"
            keyPassword "aquatv-local-release"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
}
