name: Build TV APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/tv-apk/**'
      - 'apps/dashboard/app/player/**'
      - 'apps/dashboard/middleware.ts'
      - 'apps/api/src/routes/devices.ts'
      - '.github/workflows/build-tv-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tv-apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build signed release APK
        run: gradle :app:assembleRelease

      - name: Rename APK
        run: |
          mkdir -p ../../artifacts
          cp app/build/outputs/apk/release/app-release.apk ../../artifacts/aquatv-player-v0.2.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aquatv-player-v0.2.0
          path: artifacts/aquatv-player-v0.2.0.apk
