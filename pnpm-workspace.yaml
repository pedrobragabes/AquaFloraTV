packages:
  - 'apps/*'
  - 'packages/*'

overrides:
  'deepmerge-ts@<8.0.0': 8.0.0
  '@babel/core': 7.29.6
  '@expo/dom-webview': 55.0.6
  '@napi-rs/wasm-runtime': 1.2.1
  'body-parser': 1.20.6
  'ajv@8.18.0>fast-uri': 3.1.6
  'minimatch@3.1.5>brace-expansion': 1.1.18
  'minimatch@9.0.9>brace-expansion': 2.1.4
  'minimatch@10.2.5>brace-expansion': 5.0.9
  '@istanbuljs/load-nyc-config@1.1.0>js-yaml': 3.15.2
  '@expo/xcpretty@4.4.3>js-yaml': 4.3.2
  'js-yaml@4.1.1': 4.3.2
  'postcss': 8.5.25
  'qs': 6.16.0
  'sharp': 0.35.4
  'shell-quote': 1.9.0
  'uuid': 11.1.1
  'ws@7.5.10': 7.5.11
  'ws@8.20.0': 8.21.0

patchedDependencies:
  'image-size@1.2.1': patches/image-size@1.2.1.patch

auditLevel: low
# pnpm 11.11 uses the pre-11.16 audit setting names. No fixed image-size
# release exists; both parser loops are corrected by the versioned patch
# above and enforced by security:check.
auditConfig:
  ignoreGhsas:
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-w3rx-r6r6-pgpr

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@napi-rs/wasm-runtime@1.2.1'
  - brace-expansion@1.1.18 || 2.1.4 || 5.0.9
  - fast-uri@3.1.5 || 3.1.6
  - js-yaml@3.15.1 || 3.15.2 || 4.3.1 || 4.3.2
  - qs@6.15.4 || 6.16.0
  - '@xmldom/xmldom@0.8.14 || 0.8.15 || 0.9.11 || 0.9.12'
  - sharp@0.35.4
engineStrict: true
nodeLinker: hoisted
virtualStoreDir: .pnpm

allowBuilds:
  '@prisma/client@6.19.3': true
  '@prisma/engines@6.19.3': true
  'esbuild@0.28.2': true
  'prisma@6.19.3': true
  'sharp@0.35.4': true
  'unrs-resolver@1.12.2': true
